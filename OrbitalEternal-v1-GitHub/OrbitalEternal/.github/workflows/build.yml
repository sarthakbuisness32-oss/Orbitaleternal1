
name: Build Orbital Eternal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B package
        working-directory: OrbitalEternal-v1-GitHub/OrbitalEternal

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Orbital-Eternal
          path: OrbitalEternal-v1-GitHub/OrbitalEternal/target/*.jar
